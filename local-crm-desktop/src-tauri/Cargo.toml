[package]
name = "app"
default-run = "app"
autobins = false
version = "0.2.1"
description = "A local-first, Agent-first CRM desktop application"
authors = ["renjianxin929-ux"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[features]
default = []
# Compile-time-only transport for the dedicated com.localcrm.desktop.e2e app.
# Production builds do not activate or contain this execution branch.
e2e = ["dep:tauri-plugin-wdio-webdriver"]
# Manual one-shot migration utility. Normal GUI builds and bundles do not enable it.
migration-tool = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "app"
path = "src/main.rs"

[[bin]]
name = "migrate_plaintext_credentials"
path = "src/bin/migrate_plaintext_credentials.rs"
required-features = ["migration-tool"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.52.3", features = ["rt", "sync", "macros", "time"] }
zeroize = "1.8"
uuid = { version = "1.18", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
keyring = { version = "3.6.3", features = ["apple-native"] }
aes-gcm = "0.10"
rand = "0.9.5"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
