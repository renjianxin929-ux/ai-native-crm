name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-crm-desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: local-crm-desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Run v0.2.2 CLI compatibility tests
        run: npm run test:cli

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-crm-desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: local-crm-desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: local-crm-desktop/src-tauri
      - name: Prepare full bundled CLI inputs for Rust tests
        run: npm run build:bundled-cli
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
