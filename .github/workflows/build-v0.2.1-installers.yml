name: Build v0.2.1 Installers

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - release/v0.2.1-installers
  workflow_dispatch:

concurrency:
  group: v0.2.1-installer-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_DIR: local-crm-desktop
  RELEASE_TAG: v0.2.1

jobs:
  windows-x64:
    name: Windows x64 installers
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: local-crm-desktop
    steps:
      - name: Check out v0.2.1
        uses: actions/checkout@v4
        with:
          ref: v0.2.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: local-crm-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: local-crm-desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Exclude the manual migration utility from the production bundle
        shell: pwsh
        run: |
          $manifest = "src-tauri/Cargo.toml"
          $text = [System.IO.File]::ReadAllText($manifest)
          $pattern = '(?ms)\r?\n\[\[bin\]\]\r?\nname = "migrate_plaintext_credentials"\r?\npath = "src/bin/migrate_plaintext_credentials\.rs"\r?\nrequired-features = \["migration-tool"\]\r?\n'
          $updated = [regex]::Replace($text, $pattern, [Environment]::NewLine)
          if ($updated -eq $text) {
            throw "Migration utility target block was not found in Cargo.toml."
          }
          [System.IO.File]::WriteAllText($manifest, $updated)

      - name: Build NSIS and MSI installers
        run: npm run tauri build -- --bundles nsis,msi

      - name: Preserve Windows installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-crm-v0.2.1-windows-x64
          path: |
            local-crm-desktop/src-tauri/target/release/bundle/nsis/*.exe
            local-crm-desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload Windows installers to v0.2.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -Path @(
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/target/release/bundle/msi/*.msi"
          )
          if ($assets.Count -eq 0) {
            throw "No Windows installer assets were produced."
          }
          foreach ($asset in $assets) {
            gh release upload $env:RELEASE_TAG $asset.FullName --repo ${{ github.repository }} --clobber
          }

  macos-apple-silicon:
    name: macOS Apple Silicon DMG
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: local-crm-desktop
    steps:
      - name: Check out v0.2.1
        uses: actions/checkout@v4
        with:
          ref: v0.2.1

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: local-crm-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: local-crm-desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Exclude the manual migration utility from the production bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("src-tauri/Cargo.toml")
          text = manifest.read_text()
          block = """\n[[bin]]
          name = "migrate_plaintext_credentials"
          path = "src/bin/migrate_plaintext_credentials.rs"
          required-features = ["migration-tool"]
          """
          if block not in text:
              raise SystemExit("Migration utility target block was not found in Cargo.toml.")
          manifest.write_text(text.replace(block, "\n", 1))
          PY

      - name: Build Apple Silicon DMG
        run: npm run tauri build -- --bundles dmg

      - name: Preserve Apple Silicon DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-crm-v0.2.1-macos-arm64
          path: local-crm-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Apple Silicon DMG to v0.2.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/dmg/*.dmg --repo "${{ github.repository }}" --clobber

  macos-intel:
    name: macOS Intel DMG
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        working-directory: local-crm-desktop
    steps:
      - name: Check out v0.2.1
        uses: actions/checkout@v4
        with:
          ref: v0.2.1

      - name: Confirm Intel runner
        run: test "$(uname -m)" = "x86_64"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: local-crm-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: local-crm-desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Exclude the manual migration utility from the production bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("src-tauri/Cargo.toml")
          text = manifest.read_text()
          block = """\n[[bin]]
          name = "migrate_plaintext_credentials"
          path = "src/bin/migrate_plaintext_credentials.rs"
          required-features = ["migration-tool"]
          """
          if block not in text:
              raise SystemExit("Migration utility target block was not found in Cargo.toml.")
          manifest.write_text(text.replace(block, "\n", 1))
          PY

      - name: Build Intel DMG
        run: npm run tauri build -- --bundles dmg

      - name: Preserve Intel DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-crm-v0.2.1-macos-x64
          path: local-crm-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Intel DMG to v0.2.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/dmg/*.dmg --repo "${{ github.repository }}" --clobber
